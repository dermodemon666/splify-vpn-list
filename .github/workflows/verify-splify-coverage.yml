# verify-splify-coverage.yml

name: Verify splify coverage

"on":
  workflow_dispatch:
  push:
    paths:
      - splify.lst
      - generate.sh
      - .github/workflows/verify-splify-coverage.yml
  pull_request:
    paths:
      - splify.lst
      - generate.sh
      - .github/workflows/verify-splify-coverage.yml

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original ipsum.lst
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/1andrevich/Re-filter-lists/master/ipsum.lst \
            -o /tmp/ipsum.lst

      - name: Verify original ipsum coverage
        run: |
          python3 <<'PY'
          import ipaddress
          from pathlib import Path

          def load(path):
              result = []
              for line in Path(path).read_text().splitlines():
                  line = line.strip()

                  if not line or line.startswith("#"):
                      continue

                  try:
                      n = ipaddress.ip_network(line, strict=False)
                  except ValueError:
                      continue

                  if n.version == 4:
                      result.append(n)

              return result

          ipsum = load("/tmp/ipsum.lst")
          splify = load("splify.lst")

          print(f"Original ipsum entries: {len(ipsum)}")
          print(f"Splify entries:         {len(splify)}")

          splify = list(ipaddress.collapse_addresses(splify))

          missing = []

          for src in ipsum:
              remaining = [src]

              for dst in splify:
                  new_remaining = []

                  for part in remaining:
                      if not part.overlaps(dst):
                          new_remaining.append(part)
                          continue

                      if dst.supernet_of(part) or dst == part:
                          continue

                      try:
                          new_remaining.extend(
                              ipaddress.address_exclude(part, dst)
                          )
                      except ValueError:
                          new_remaining.append(part)

                  remaining = new_remaining

                  if not remaining:
                      break

              if remaining:
                  missing.append(src)

          if missing:
              print("")
              print("FAIL: original ipsum contains uncovered networks:")
              print("")

              for network in missing[:100]:
                  print(f"  {network}")

              if len(missing) > 100:
                  print(f"  ... and {len(missing) - 100} more")

              raise SystemExit(1)

          print("")
          print("PASS: every original ipsum network is covered by splify.lst")

      - name: Check Google DNS exclusion
        run: |
          if grep -Eq '^8\.8\.(4|8)\.0/24$' splify.lst; then
            echo "FAIL: Google DNS range found"
            exit 1
          fi

          echo "PASS: Google DNS ranges are excluded"

      - name: Show statistics
        run: |
          echo "========== STATISTICS =========="
          echo "Original ipsum:"
          grep -Ec '^[0-9]+\.' /tmp/ipsum.lst || true
          echo "Splify:"
          grep -Ec '^[0-9]+\.' splify.lst || true
          echo "================================"
