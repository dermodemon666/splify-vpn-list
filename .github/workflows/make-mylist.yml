name: Generate mylist.lst

on:
  workflow_dispatch:
  push:
    paths:
      - "123.lst"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate mylist.lst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("123.lst")
          dst = Path("mylist.lst")

          text = src.read_text(encoding="utf-8", errors="ignore")
          subnets = []

          for line in text.splitlines():
              if "AllowedIPs" not in line or "=" not in line:
                  continue

              value = line.split("=", 1)[1]

              for item in value.split(","):
                  item = item.strip()

                  if re.fullmatch(
                      r"\d{1,3}(?:\.\d{1,3}){3}/(?:[0-9]|[12][0-9]|3[0-2])",
                      item
                  ):
                      subnets.append(item)

          subnets = list(dict.fromkeys(subnets))

          dst.write_text(
              "\n".join(subnets) + "\n",
              encoding="utf-8"
          )

          print(f"Generated {len(subnets)} subnets")

          PY

      - name: Commit mylist.lst
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mylist.lst

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Generate mylist.lst"
            git push
          fi
