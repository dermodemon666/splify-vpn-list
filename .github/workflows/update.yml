name: Update splify IP list

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils

      - name: Generate list
        run: |
          chmod +x generate.sh
          ./generate.sh

      - name: Check generated list
        run: |
          test -s splify.lst
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/[0-9]+$' splify.lst

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add splify.lst

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update splify IP list"
          git push
